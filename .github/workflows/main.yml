name: Extract Phase 3

on:
  workflow_dispatch:
  push:
    paths:
      - 'doclix-phase3-root.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Phase 3
        run: |
          rm -rf /tmp/doclix
          mkdir -p /tmp/doclix
          unzip -q doclix-phase3-root.zip -d /tmp/doclix
          cp -a /tmp/doclix/. .
          rm -f doclix-phase3-root.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract Doclix Phase 3 source"
          git push
