name: Build Doclix Autofill APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/doclix-autofill/**'
      - '.github/workflows/doclix-autofill-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Static source security gate
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE             'BIND_ACCESSIBILITY_SERVICE|DoclixAccessibilityService|AccessibilityService|ACTION_ACCESSIBILITY_SETTINGS|ACTION_SET_TEXT'             app/src/main; then
            echo "ERROR: Accessibility/field-injection code remains in the production source."
            exit 1
          fi

          test ! -f app/src/main/res/xml/doclix_accessibility_service.xml

      - name: Build debug APK
        working-directory: android/doclix-autofill
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        working-directory: android/doclix-autofill
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK manifest has no AccessibilityService
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"

          test -n "$AAPT"

          "$AAPT" dump permissions "$APK" | tee /tmp/doclix-permissions.txt
          "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > /tmp/doclix-manifest.txt

          if grep -q "BIND_ACCESSIBILITY_SERVICE" /tmp/doclix-permissions.txt; then
            echo "ERROR: Accessibility permission is present in APK."
            exit 1
          fi

          if grep -q "DoclixAccessibilityService" /tmp/doclix-manifest.txt; then
            echo "ERROR: Accessibility service is present in APK manifest."
            exit 1
          fi

          if grep -q "android.accessibilityservice.AccessibilityService" /tmp/doclix-manifest.txt; then
            echo "ERROR: Accessibility service declaration is present in APK manifest."
            exit 1
          fi

          echo "Security gate passed: no AccessibilityService declaration detected."

      - name: Verify APK bytecode has no Doclix Accessibility class
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if unzip -l "$APK" | grep -q "DoclixAccessibilityService"; then
            echo "ERROR: DoclixAccessibilityService class is packaged in APK."
            exit 1
          fi

          echo "Security gate passed: no DoclixAccessibilityService class packaged."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doclix-autofill-v1.2-clean-apk
          path: android/doclix-autofill/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
