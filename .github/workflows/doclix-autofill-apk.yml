name: Build Doclix Autofill APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/doclix-autofill/**'
      - '.github/workflows/doclix-autofill-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Static source security gate
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE             'BIND_ACCESSIBILITY_SERVICE|DoclixAccessibilityService|AccessibilityService|ACTION_ACCESSIBILITY_SETTINGS|ACTION_SET_TEXT'             app/src/main; then
            echo "ERROR: prohibited high-privilege field-assist code remains in production source."
            exit 1
          fi

          test ! -f app/src/main/res/xml/doclix_accessibility_service.xml

      - name: Production privilege pre-build gate
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"

          if grep -nEi 'AccessibilityService|BIND_ACCESSIBILITY_SERVICE|android.accessibilityservice.AccessibilityService' "$MANIFEST"; then
            echo "ERROR: prohibited AccessibilityService declaration found in AndroidManifest.xml."
            exit 1
          fi

          if grep -RInE 'BIND_ACCESSIBILITY_SERVICE|DoclixAccessibilityService|AccessibilityService|ACTION_ACCESSIBILITY_SETTINGS|ACTION_SET_TEXT' app/src/main; then
            echo "ERROR: prohibited Accessibility field-assist reference found in production source."
            exit 1
          fi

          test ! -f app/src/main/res/xml/doclix_accessibility_service.xml

          echo "Production privilege gate passed: native Autofill only."

      - name: Run field-mapping unit tests
        working-directory: android/doclix-autofill
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        working-directory: android/doclix-autofill
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        working-directory: android/doclix-autofill
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK manifest has only native Autofill service
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort | tail -n 1)"

          test -n "$AAPT"

          "$AAPT" dump permissions "$APK" > /tmp/doclix-permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/doclix-manifest.txt

          if grep -Fq "BIND_ACCESSIBILITY_SERVICE" /tmp/doclix-permissions.txt; then
            echo "ERROR: Accessibility binding permission is present."
            exit 1
          fi

          if grep -Fq "DoclixAccessibilityService" /tmp/doclix-manifest.txt; then
            echo "ERROR: Doclix field-assist service is present."
            exit 1
          fi

          if grep -Fq "android.accessibilityservice.AccessibilityService" /tmp/doclix-manifest.txt; then
            echo "ERROR: Accessibility service component is present."
            exit 1
          fi

          if ! grep -Fq "android.permission.BIND_AUTOFILL_SERVICE" /tmp/doclix-manifest.txt; then
            echo "ERROR: Native Autofill binding permission is missing from service declaration."
            exit 1
          fi

          if ! grep -Fq "com.doclix.autofill.DoclixAutofillService" /tmp/doclix-manifest.txt; then
            echo "ERROR: Doclix native Autofill service is missing."
            exit 1
          fi

          echo "Manifest security gate passed."

      - name: Verify APK bytecode has no field-assist class
        working-directory: android/doclix-autofill
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if unzip -l "$APK" | grep -q "DoclixAccessibilityService"; then
            echo "ERROR: field-assist class is packaged in APK."
            exit 1
          fi

          echo "Bytecode/package gate passed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doclix-autofill-v1.2-clean-apk
          path: android/doclix-autofill/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
