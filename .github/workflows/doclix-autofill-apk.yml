name: Build Doclix Autofill APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/doclix-autofill/**'
      - '.github/workflows/doclix-autofill-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android/doclix-autofill
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK
        working-directory: android/doclix-autofill
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: doclix-autofill-debug-apk
          path: android/doclix-autofill/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
