name: Extract Project

on:
  push:
    paths:
      - "*.zip" 
  workflow_dispatch:
permissions:
  contents: write

jobs:  
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o legal-doc-saas-phase3.zip -d extracted
          cp -r extracted/* .
          rm -rf extracted legal-doc-saas-phase3.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract Doclix project" || true
          git push  
